<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <radialGradient id="bg-t" cx="40%" cy="60%" r="65%">
      <stop offset="0%" stop-color="#1a1000"/>
      <stop offset="100%" stop-color="#080500"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg-t)"/>

  <!-- Subtle grid -->
  <line x1="80"  y1="320" x2="720" y2="320" stroke="#ffa726" stroke-width="0.4" stroke-opacity="0.10"/>
  <line x1="80"  y1="240" x2="720" y2="240" stroke="#ffa726" stroke-width="0.4" stroke-opacity="0.10"/>
  <line x1="80"  y1="160" x2="720" y2="160" stroke="#ffa726" stroke-width="0.4" stroke-opacity="0.10"/>
  <line x1="245" y1="60"  x2="245" y2="420" stroke="#ffa726" stroke-width="0.4" stroke-opacity="0.10"/>
  <line x1="410" y1="60"  x2="410" y2="420" stroke="#ffa726" stroke-width="0.4" stroke-opacity="0.10"/>
  <line x1="575" y1="60"  x2="575" y2="420" stroke="#ffa726" stroke-width="0.4" stroke-opacity="0.10"/>

  <!-- Axes -->
  <line x1="80" y1="400" x2="720" y2="400" stroke="#ffa726" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="80" y1="60"  x2="80"  y2="400" stroke="#ffa726" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Axis arrow tips -->
  <polygon points="720,395 730,400 720,405" fill="#ffa726" fill-opacity="0.6"/>
  <polygon points="75,60 80,50 85,60"         fill="#ffa726" fill-opacity="0.6"/>

  <!-- Trend line: from (100,380) to (700,95) -->
  <line x1="100" y1="380" x2="700" y2="95" stroke="#ffa726" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="8 5"/>

  <!-- Data points — near trend -->
  <circle cx="125" cy="368" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="168" cy="348" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="210" cy="328" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="258" cy="298" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="302" cy="282" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="345" cy="258" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="385" cy="244" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="428" cy="218" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="472" cy="206" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="515" cy="184" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="558" cy="166" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="598" cy="148" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="638" cy="130" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="680" cy="108" r="6" fill="#ffa726" fill-opacity="0.85"/>
  <circle cx="698" cy="98"  r="6" fill="#ffa726" fill-opacity="0.85"/>

  <!-- Outlier points (lighter, slightly larger) -->
