  <circle cx="318" cy="318" r="7" fill="#ffcc80" fill-opacity="0.65"/>
  <circle cx="448" cy="168" r="7" fill="#ffcc80" fill-opacity="0.65"/>
  <circle cx="548" cy="214" r="7" fill="#ffcc80" fill-opacity="0.65"/>
  <circle cx="660" cy="158" r="7" fill="#ffcc80" fill-opacity="0.65"/>
</svg>
