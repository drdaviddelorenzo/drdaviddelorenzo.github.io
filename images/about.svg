<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <radialGradient id="bg-a" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="100%" stop-color="#040c14"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg-a)"/>

  <!-- Concentric rings -->
  <circle cx="400" cy="240" r="105" fill="none" stroke="#4dd0e1" stroke-width="0.5" stroke-opacity="0.12"/>
  <circle cx="400" cy="240" r="180" fill="none" stroke="#4dd0e1" stroke-width="0.5" stroke-opacity="0.09"/>
  <circle cx="400" cy="240" r="255" fill="none" stroke="#4dd0e1" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Outer ring perimeter connections -->
  <line x1="200" y1="100" x2="340" y2="68"  stroke="#4dd0e1" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="340" y1="68"  x2="600" y2="108" stroke="#4dd0e1" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="600" y1="108" x2="690" y2="252" stroke="#4dd0e1" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="690" y1="252" x2="580" y2="392" stroke="#4dd0e1" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="580" y1="392" x2="460" y2="418" stroke="#4dd0e1" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="460" y1="418" x2="220" y2="392" stroke="#4dd0e1" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="220" y1="392" x2="110" y2="252" stroke="#4dd0e1" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="110" y1="252" x2="200" y2="100" stroke="#4dd0e1" stroke-width="0.8" stroke-opacity="0.18"/>

  <!-- Spokes to centre -->
  <line x1="400" y1="240" x2="200" y2="100" stroke="#4dd0e1" stroke-width="1.5" stroke-opacity="0.38"/>
  <line x1="400" y1="240" x2="340" y2="68"  stroke="#4dd0e1" stroke-width="1.5" stroke-opacity="0.38"/>
  <line x1="400" y1="240" x2="600" y2="108" stroke="#4dd0e1" stroke-width="1.5" stroke-opacity="0.38"/>
  <line x1="400" y1="240" x2="690" y2="252" stroke="#4dd0e1" stroke-width="1.5" stroke-opacity="0.38"/>
  <line x1="400" y1="240" x2="580" y2="392" stroke="#4dd0e1" stroke-width="1.5" stroke-opacity="0.38"/>
  <line x1="400" y1="240" x2="460" y2="418" stroke="#4dd0e1" stroke-width="1.5" stroke-opacity="0.38"/>
  <line x1="400" y1="240" x2="220" y2="392" stroke="#4dd0e1" stroke-width="1.5" stroke-opacity="0.38"/>
  <line x1="400" y1="240" x2="110" y2="252" stroke="#4dd0e1" stroke-width="1.5" stroke-opacity="0.38"/>

  <!-- Satellite nodes -->
  <circle cx="200" cy="100" r="20" fill="#060e18" stroke="#4dd0e1" stroke-width="1.8" stroke-opacity="0.75"/>
  <circle cx="200" cy="100" r="8"  fill="#4dd0e1" fill-opacity="0.75"/>

  <circle cx="340" cy="68"  r="15" fill="#060e18" stroke="#4dd0e1" stroke-width="1.8" stroke-opacity="0.75"/>
  <circle cx="340" cy="68"  r="6"  fill="#4dd0e1" fill-opacity="0.75"/>

  <circle cx="600" cy="108" r="18" fill="#060e18" stroke="#4dd0e1" stroke-width="1.8" stroke-opacity="0.75"/>
  <circle cx="600" cy="108" r="7"  fill="#4dd0e1" fill-opacity="0.75"/>

  <circle cx="690" cy="252" r="23" fill="#060e18" stroke="#4dd0e1" stroke-width="1.8" stroke-opacity="0.75"/>
  <circle cx="690" cy="252" r="9"  fill="#4dd0e1" fill-opacity="0.75"/>

  <circle cx="580" cy="392" r="17" fill="#060e18" stroke="#4dd0e1" stroke-width="1.8" stroke-opacity="0.75"/>
  <circle cx="580" cy="392" r="7"  fill="#4dd0e1" fill-opacity="0.75"/>

  <circle cx="460" cy="418" r="13" fill="#060e18" stroke="#4dd0e1" stroke-width="1.8" stroke-opacity="0.75"/>
  <circle cx="460" cy="418" r="5"  fill="#4dd0e1" fill-opacity="0.75"/>

  <circle cx="220" cy="392" r="20" fill="#060e18" stroke="#4dd0e1" stroke-width="1.8" stroke-opacity="0.75"/>
  <circle cx="220" cy="392" r="8"  fill="#4dd0e1" fill-opacity="0.75"/>

  <circle cx="110" cy="252" r="16" fill="#060e18" stroke="#4dd0e1" stroke-width="1.8" stroke-opacity="0.75"/>
  <circle cx="110" cy="252" r="6"  fill="#4dd0e1" fill-opacity="0.75"/>

  <!-- Central node -->
  <circle cx="400" cy="240" r="52" fill="#4dd0e1" fill-opacity="0.06"/>
  <circle cx="400" cy="240" r="52" fill="none" stroke="#4dd0e1" stroke-width="2" stroke-opacity="0.85"/>
  <circle cx="400" cy="240" r="34" fill="#4dd0e1" fill-opacity="0.10"/>
  <circle cx="400" cy="240" r="20" fill="#4dd0e1" fill-opacity="0.70"/>
</svg>
